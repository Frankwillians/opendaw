# Instalador NSIS do OpenDAW. O app já vem montado em release/stage-app por
# desktop/build-release.cjs; aqui só embalamos. electronDist aponta para o
# Electron já instalado — nada é baixado além do NSIS em si.
appId: com.opendaw.studio
productName: OpenDAW
copyright: © 2026 OpenDAW
directories:
  app: ../release/stage-app
  output: ../release/github
  buildResources: build-res
asar: false
electronDist: node_modules/electron/dist
files:
  - "**/*"
  - "!**/*.map"
win:
  icon: build-res/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenDAW
  installerIcon: build-res/icon.ico
  uninstallerIcon: build-res/icon.ico
  installerHeaderIcon: build-res/icon.ico
  artifactName: OpenDAW-Setup-${version}.exe
  deleteAppDataOnUninstall: false